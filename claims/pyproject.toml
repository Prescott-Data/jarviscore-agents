[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarviscore-claims"
version = "0.1.0"
description = "An insurance claims team and its agents, held to the organisation's own scopes, approvals and records."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["jarviscore-framework[redis]>=3.0.1,<4", "pyyaml>=6"]

[project.optional-dependencies]
hub = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.20", "httpx>=0.27", "ruff>=0.15",
       "jarviscore-claims[hub]"]

[tool.setuptools]
packages = ["claims"]

[tool.setuptools.package-data]
claims = ["policy.yaml", "atoms/claims_hub/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = [".jarviscore", "blob_storage", ".venv", "claims/atoms"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["claims"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"claims/claims_hub.py" = ["E501"]
